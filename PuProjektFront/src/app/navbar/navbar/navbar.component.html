<div class="card custom-navbar">
  <p-menubar [model]="items">

      <ng-template #start>
        <img ngSrc="assets/images/logo.png" alt="Logo" class="logo" height="35" width="33"/>
      </ng-template>

    <ng-template #item let-item let-root="root">
      <a
        pRipple
        class="flex items-center p-menubar-item-link"
        [routerLink]="item.routerLink"
        [queryParams]="item.queryParams"
        [fragment]="item.fragment"
        [routerLinkActive]="'active-link'"
        [ngClass]="{ 'router-link-active': item.routerLink }"
      >
        <i *ngIf="item.icon" [ngClass]="item.icon"></i>
        <span>{{ item.label }}</span>
        <p-badge *ngIf="item.badge" [ngClass]="{ 'ml-auto': !root, 'ml-2': root }" [value]="item.badge"></p-badge>
        <span *ngIf="item.shortcut" class="ml-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut }}</span>
        <i *ngIf="item.items" [ngClass]="['ml-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
      </a>
    </ng-template>
    <ng-template #end>
      <div class="d-flex align-items-center gap-4" style="width: 500px">
        <div style="background-color: #18181b; border-color: #18181b" class="form-control w-100"></div>
        <img
          ngSrc="assets/images/avatar.png"
          height="35" width="33"
          alt="Avatar"
          class="rounded-circle"
          style=" cursor: pointer;"
          (click)="profileVisible = true"
        />
      </div>
    </ng-template>
  </p-menubar>
</div>


<p-drawer [(visible)]="profileVisible" [closable]="false" position="right">
  <ng-template #header>
    <div class="flex items-center gap-2">
      <h4> Dane użytkownika <img
        ngSrc="assets/images/avatar.png"
        height="35" width="33"
        alt="Avatar"
        class="rounded-circle"
      /></h4>
    </div>
  </ng-template>
  <div class="row mt-5">
    <div class="col-lg-6">
      <h5>Imię</h5>
    </div>
    <div class="col-lg-6">
      <div style="color: #a1a1aa" [innerHTML]="profileData.name"></div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6">
    <h5>Nazwisko</h5>
    </div>
    <div class="col-lg-6">
    <div style="color: #a1a1aa" [innerHTML]="profileData.surname"></div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-6">
      <h5>Adres email</h5>
    </div>
    <div class="col-lg-6">
      <div style="color: #a1a1aa" [innerHTML]="profileData.email"></div>
    </div>
  </div>
  <div class="row mt-5">
<div class="col-lg-6">
  <div style="cursor: pointer" (click)="editUserData()"
       class="d-flex flex-column align-items-center justify-content-between p-2 border rounded w-100">
    <span class="pi pi-pencil"></span>
    <span>Edytuj profil</span>
  </div>
</div>
    <div class="col-lg-6">
      <div style="cursor: pointer" (click)="initChangePassword()"
           class="d-flex flex-column align-items-center justify-content-between p-2 border rounded w-100">
        <span class="pi pi-lock"></span>
        <span>Edytuj hasło</span>
      </div>
    </div>



  </div>
  <ng-template #footer>
    <div>
      <button (click)="logOut()" pButton label="Wyloguj się" icon="pi pi-sign-out" class="w-full" severity="danger" text></button>
    </div>
  </ng-template>
</p-drawer>
