<div class="register-wrapper">
  <form [formGroup]="form" (submit)="register()">
    <div class="form-container">
      <h1>{{header}}</h1>
      <span *ngIf="isRegisterMode()">Masz już konto? <a [routerLink]="'/login'">Zaloguj się</a></span>
      <div>
        <div class="row">
          <div class="col-lg-6">
            <p-floatlabel variant="on">
              <input pInputText id="name" type="text" formControlName="name" />
              <label for="name">Imię</label>
            </p-floatlabel>
          </div>
          <div class="col-lg-6">
            <p-floatlabel variant="on">
              <input pInputText id="surname" type="text" formControlName="surname" />
              <label for="surname">Nazwisko</label>
            </p-floatlabel>
          </div>
        </div>
        <div class="row">
          <div class="col-lg-12">
            <p-floatlabel variant="on">
            <input pInputText id="email" type="email" formControlName="email" email />
            <label for="email">Adres email</label>
            </p-floatlabel>
          </div>
        </div>
        <p-floatlabel *ngIf="isRegisterMode()" variant="on">
          <p-password
            [inputStyle]="{'width':'100%'}"
            [style]="{'width':'100%'}"
            id="password"
            formControlName="password"
            [feedback]="false"
            [ngClass]="{'ng-invalid': form.hasError('passwordMismatch') && form.get('repeatPassword')?.touched, 'ng-dirty': form.get('password')?.dirty}"
            [toggleMask]="true" />
          <label for="password">Hasło</label>
        </p-floatlabel>
        <p-floatlabel *ngIf="isRegisterMode()" variant="on">
          <p-password
            [inputStyle]="{'width':'100%'}"
            [style]="{'width':'100%'}"
            id="repeatPassword"
            formControlName="repeatPassword"
            [feedback]="false"
            [ngClass]="{'ng-invalid': form.hasError('passwordMismatch') && form.get('repeatPassword')?.touched, 'ng-dirty': form.get('password')?.dirty}"
            [toggleMask]="true" />
          <label for="repeatPassword">Powtórz hasło</label>
          <div *ngIf="form.hasError('passwordMismatch') && form.get('repeatPassword')?.touched">
            <small class="error-message">Hasła muszą być takie same</small>
          </div>
        </p-floatlabel>
      </div>
      <button *ngIf="isRegisterMode()" type="submit" [disabled]="!form.valid" pButton pRipple >Załóż konto <i class="pi pi-check"></i></button>
      <div *ngIf="!isRegisterMode()" class="row mt-0">
        <div class="col-lg-6">
          <button style="width: 100%" type="button" class="p-button-secondary p-button-outlined" pButton pRipple (click)="cancel()" >Anuluj </button>
        </div>
        <div class="col-lg-6">
          <button style="width: 100%" type="button" [disabled]="!form.valid" pButton pRipple (click)="editData()" >Edytuj dane <i class="pi pi-check"></i></button>
        </div>
      </div>
    </div>
  </form>
</div>
